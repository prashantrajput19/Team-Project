<svg class="hero-ill" viewBox="0 0 640 560" role="img"
    aria-label="A modern home at sunset marked with a location pin, a five star architect card and an answered inquiry">
    <defs>
        <linearGradient id="hzSky" x1="0" y1="0" x2="0" y2="1">
            <stop class="sky1" offset="0"/>
            <stop class="sky2" offset="0.6"/>
            <stop class="sky3" offset="1"/>
        </linearGradient>
        <linearGradient id="hzWindow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe2a6"/>
            <stop offset="1" stop-color="#f2a93b"/>
        </linearGradient>
        <radialGradient id="hzSun">
            <stop offset="0" stop-color="#ffd27a"/>
            <stop offset="1" stop-color="#f2a93b"/>
        </radialGradient>
        <clipPath id="hzFrame">
            <rect width="640" height="560" rx="32"/>
        </clipPath>
    </defs>

    <g clip-path="url(#hzFrame)">
        <!-- Sky, sun and clouds -->
        <rect width="640" height="560" fill="url(#hzSky)"/>
        <circle class="halo pulse" cx="480" cy="170" r="96"/>
        <circle class="halo" cx="480" cy="170" r="64"/>
        <circle cx="480" cy="170" r="42" fill="url(#hzSun)"/>

        <g class="cloud drift-a">
            <ellipse cx="130" cy="110" rx="48" ry="15"/>
            <ellipse cx="108" cy="99" rx="22" ry="15"/>
            <ellipse cx="140" cy="94" rx="26" ry="19"/>
        </g>
        <g class="cloud drift-b">
            <ellipse cx="360" cy="70" rx="36" ry="11"/>
            <ellipse cx="372" cy="61" rx="20" ry="13"/>
        </g>

        <!-- City far away -->
        <g class="skyline">
            <rect x="10" y="270" width="36" height="110"/>
            <rect x="50" y="240" width="28" height="140"/>
            <rect x="82" y="290" width="44" height="90"/>
            <rect x="500" y="256" width="32" height="124"/>
            <rect x="536" y="228" width="40" height="152"/>
            <rect x="580" y="282" width="50" height="98"/>
        </g>

        <!-- Hills and lawn -->
        <path class="hill" d="M0 380 Q160 330 320 370 T640 360 V560 H0 Z"/>
        <path class="lawn" d="M0 420 Q320 390 640 420 V560 H0 Z"/>
        <ellipse class="shadow" cx="330" cy="430" rx="190" ry="16"/>

        <!-- Modern two storey house -->
        <rect class="upper" x="250" y="236" width="200" height="86"/>
        <rect class="slab" x="236" y="226" width="228" height="12"/>
        <rect class="wall" x="180" y="320" width="300" height="104"/>
        <rect class="slab" x="168" y="312" width="324" height="12"/>
        <rect x="268" y="252" width="70" height="52" rx="3" fill="url(#hzWindow)" class="lit"/>
        <rect x="354" y="252" width="80" height="52" rx="3" fill="url(#hzWindow)" class="lit lit-b"/>
        <path class="mullion" d="M303 252v52M394 252v52"/>
        <rect x="198" y="342" width="96" height="60" rx="3" fill="url(#hzWindow)" class="lit lit-b"/>
        <path class="mullion" d="M230 342v60M262 342v60"/>
        <rect class="wood" x="390" y="332" width="74" height="92"/>
        <path class="slat" d="M400 332v92M412 332v92M424 332v92M436 332v92M448 332v92"/>
        <rect class="door" x="316" y="350" width="44" height="74" rx="3"/>
        <circle class="knob" cx="352" cy="388" r="3"/>
        <path class="path" d="M316 424 L300 470 H376 L360 424 Z"/>

        <!-- Trees -->
        <rect class="trunk" x="122" y="372" width="8" height="52"/>
        <circle class="tree" cx="126" cy="356" r="32"/>
        <circle class="tree-l" cx="114" cy="344" r="15"/>
        <rect class="trunk" x="526" y="384" width="7" height="40"/>
        <ellipse class="cypress" cx="530" cy="350" rx="18" ry="44"/>
        <circle class="bush" cx="186" cy="428" r="16"/>
        <circle class="bush" cx="478" cy="430" r="14"/>
    </g>

    <!-- Location pin bouncing above the house -->
    <g class="pin">
        <ellipse class="pin-shadow" cx="350" cy="214" rx="14" ry="4"/>
        <g class="pin-bounce">
            <path class="pin-body" d="M350 210 C 332 186 324 172 324 160 a26 26 0 0 1 52 0 c0 12 -8 26 -26 50 z"/>
            <circle class="pin-dot" cx="350" cy="160" r="10"/>
        </g>
    </g>

    <!-- Architect card with 5 stars -->
    <g class="float-a">
        <rect class="card" x="28" y="160" width="196" height="76" rx="18"/>
        <circle class="av" cx="64" cy="198" r="20"/>
        <path class="av-person" d="M64 190 a6 6 0 1 0 0.1 0 M52 210 a12 9 0 0 1 24 0"/>
        <rect class="bar strong" x="94" y="180" width="100" height="10" rx="5"/>
        <g class="st">
            <path d="M100 202 l3 6 6.5 1 -4.7 4.6 1.1 6.4 -5.9 -3.1 -5.9 3.1 1.1 -6.4 -4.7 -4.6 6.5 -1z"/>
            <path d="M120 202 l3 6 6.5 1 -4.7 4.6 1.1 6.4 -5.9 -3.1 -5.9 3.1 1.1 -6.4 -4.7 -4.6 6.5 -1z"/>
            <path d="M140 202 l3 6 6.5 1 -4.7 4.6 1.1 6.4 -5.9 -3.1 -5.9 3.1 1.1 -6.4 -4.7 -4.6 6.5 -1z"/>
            <path d="M160 202 l3 6 6.5 1 -4.7 4.6 1.1 6.4 -5.9 -3.1 -5.9 3.1 1.1 -6.4 -4.7 -4.6 6.5 -1z"/>
            <path d="M180 202 l3 6 6.5 1 -4.7 4.6 1.1 6.4 -5.9 -3.1 -5.9 3.1 1.1 -6.4 -4.7 -4.6 6.5 -1z"/>
        </g>
    </g>

    <!-- Dashed line from the card to the house -->
    <path class="flow" d="M224 210 C 270 210 290 200 322 168"/>

    <!-- Inquiry replied bubble -->
    <g class="float-b">
        <rect class="card" x="404" y="458" width="208" height="70" rx="18"/>
        <path class="card" d="M430 528 l-10 16 l26 -16 z"/>
        <rect class="bar strong" x="424" y="476" width="120" height="10" rx="5"/>
        <rect class="bar" x="424" y="496" width="150" height="8" rx="4"/>
        <rect class="bar" x="424" y="510" width="96" height="8" rx="4"/>
        <circle class="ok" cx="584" cy="482" r="13"/>
        <path class="ok-t" d="M578 482 l4 4 l7 -8"/>
    </g>

    <!-- Sparkles -->
    <g class="spark s1"><path d="M260 60 v18 M251 69 h18"/></g>
    <g class="spark s2"><path d="M600 120 v12 M594 126 h12"/></g>
</svg>
