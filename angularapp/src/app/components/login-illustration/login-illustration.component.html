<svg class="login-ill" viewBox="0 0 640 520" role="img"
    aria-label="A warm lit home with its door open, a welcome back card and a five star architect card">
    <defs>
        <linearGradient id="lgWindow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe2a6"/>
            <stop offset="1" stop-color="#f2a93b"/>
        </linearGradient>
        <radialGradient id="lgGlow">
            <stop offset="0" stop-color="#ffd27a" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Background with blueprint grid -->
    <rect class="bg" width="640" height="520" rx="32"/>
    <path class="grid" d="M40 0v520M80 0v520M120 0v520M160 0v520M200 0v520M240 0v520M280 0v520M320 0v520M360 0v520M400 0v520M440 0v520M480 0v520M520 0v520M560 0v520M600 0v520M0 40h640M0 80h640M0 120h640M0 160h640M0 200h640M0 240h640M0 280h640M0 320h640M0 360h640M0 400h640M0 440h640M0 480h640"/>

    <!-- Moon and stars -->
    <circle class="moon" cx="520" cy="96" r="30"/>
    <circle class="bg" cx="532" cy="86" r="26"/>
    <g class="spark s1"><path d="M110 70 v18 M101 79 h18"/></g>
    <g class="spark s2"><path d="M420 50 v12 M414 56 h12"/></g>
    <g class="spark s3"><path d="M590 200 v14 M583 207 h14"/></g>

    <!-- Glow coming out of the open door -->
    <ellipse cx="320" cy="400" rx="170" ry="70" fill="url(#lgGlow)" class="door-glow"/>
    <ellipse class="ground" cx="320" cy="412" rx="250" ry="22"/>

    <!-- House -->
    <polygon class="roof" points="170,226 320,120 470,226"/>
    <polygon class="roof-edge" points="158,234 320,116 482,234 470,238 320,130 170,238"/>
    <rect class="chimney" x="402" y="140" width="24" height="52"/>
    <rect class="wall" x="188" y="226" width="264" height="182"/>
    <rect x="210" y="254" width="58" height="54" rx="4" fill="url(#lgWindow)" class="lit"/>
    <rect x="372" y="254" width="58" height="54" rx="4" fill="url(#lgWindow)" class="lit lit-b"/>
    <path class="frame" d="M239 254v54M210 281h58M401 254v54M372 281h58"/>

    <!-- Open door with light inside -->
    <rect class="door-in" x="292" y="318" width="56" height="90" rx="4"/>
    <polygon class="door" points="292,318 312,324 312,402 292,408"/>
    <circle class="knob" cx="307" cy="364" r="3"/>
    <rect class="mat" x="282" y="406" width="76" height="8" rx="4"/>

    <!-- Plants -->
    <circle class="leaf" cx="162" cy="392" r="24"/>
    <circle class="leaf-l" cx="148" cy="382" r="12"/>
    <circle class="leaf" cx="480" cy="394" r="20"/>
    <circle class="leaf-l" cx="490" cy="386" r="9"/>

    <!-- "Welcome back" card -->
    <g class="float-a">
        <rect class="card" x="40" y="140" width="190" height="64" rx="16"/>
        <circle class="av" cx="72" cy="172" r="16"/>
        <path class="av-person" d="M72 166 a5 5 0 1 0 0.1 0 M62 182 a10 8 0 0 1 20 0"/>
        <rect class="bar strong" x="98" y="160" width="96" height="9" rx="4.5"/>
        <rect class="bar" x="98" y="177" width="64" height="8" rx="4"/>
        <circle class="ok" cx="208" cy="172" r="11"/>
        <path class="ok-t" d="M203 172 l3.5 3.5 l6 -7"/>
    </g>

    <!-- Rating card -->
    <g class="float-b">
        <rect class="card" x="430" y="300" width="178" height="62" rx="16"/>
        <rect class="bar strong" x="448" y="316" width="88" height="9" rx="4.5"/>
        <g class="st">
            <path d="M456 335 l3 6 6.5 1 -4.7 4.6 1.1 6.4 -5.9 -3.1 -5.9 3.1 1.1 -6.4 -4.7 -4.6 6.5 -1z"/>
            <path d="M478 335 l3 6 6.5 1 -4.7 4.6 1.1 6.4 -5.9 -3.1 -5.9 3.1 1.1 -6.4 -4.7 -4.6 6.5 -1z"/>
            <path d="M500 335 l3 6 6.5 1 -4.7 4.6 1.1 6.4 -5.9 -3.1 -5.9 3.1 1.1 -6.4 -4.7 -4.6 6.5 -1z"/>
            <path d="M522 335 l3 6 6.5 1 -4.7 4.6 1.1 6.4 -5.9 -3.1 -5.9 3.1 1.1 -6.4 -4.7 -4.6 6.5 -1z"/>
            <path d="M544 335 l3 6 6.5 1 -4.7 4.6 1.1 6.4 -5.9 -3.1 -5.9 3.1 1.1 -6.4 -4.7 -4.6 6.5 -1z"/>
        </g>
    </g>

    <!-- Key + password card at the bottom -->
    <g class="float-c">
        <rect class="card" x="190" y="444" width="260" height="52" rx="16"/>
        <circle class="key-ring" cx="222" cy="470" r="11"/>
        <path class="key-shaft" d="M233 470 h34 M258 470 v8 M266 470 v6"/>
        <rect class="bar" x="284" y="465" width="110" height="10" rx="5"/>
        <rect class="caret" x="400" y="458" width="3" height="24" rx="1.5"/>
    </g>
</svg>
