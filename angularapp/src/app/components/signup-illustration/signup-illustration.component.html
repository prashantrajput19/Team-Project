<svg class="signup-ill" viewBox="0 0 640 520" role="img"
    aria-label="A blueprint where a new house is being drawn, with a new account card and a checklist">

    <!-- Background with grid -->
    <rect class="bg" width="640" height="520" rx="32"/>
    <path class="grid" d="M40 0v520M80 0v520M120 0v520M160 0v520M200 0v520M240 0v520M280 0v520M320 0v520M360 0v520M400 0v520M440 0v520M480 0v520M520 0v520M560 0v520M600 0v520M0 40h640M0 80h640M0 120h640M0 160h640M0 200h640M0 240h640M0 280h640M0 320h640M0 360h640M0 400h640M0 440h640M0 480h640"/>

    <circle class="ring" cx="330" cy="270" r="200"/>
    <circle class="ring ring-dash" cx="330" cy="270" r="168"/>

    <!-- Blueprint sheet -->
    <g class="sheet-wrap">
        <rect class="sheet-shadow" x="182" y="118" width="300" height="300" rx="14"/>
        <rect class="sheet" x="176" y="110" width="300" height="300" rx="14"/>
        <path class="sheet-grid" d="M206 110v300M236 110v300M266 110v300M296 110v300M326 110v300M356 110v300M386 110v300M416 110v300M446 110v300M176 140h300M176 170h300M176 200h300M176 230h300M176 260h300M176 290h300M176 320h300M176 350h300M176 380h300"/>

        <!-- House outline that draws itself -->
        <path class="draw" d="M236 360 V250 L326 186 L416 250 V360 Z"/>
        <path class="draw d2" d="M306 360 V306 H346 V360"/>
        <path class="draw d3" d="M254 270 H290 V300 H254 Z M362 270 H398 V300 H362 Z"/>

        <!-- Measurement line -->
        <path class="dim" d="M236 384 H416 M236 378 v12 M416 378 v12"/>
        <rect class="dim-box" x="300" y="376" width="52" height="16" rx="4"/>
    </g>

    <!-- Pencil drawing on the sheet -->
    <g class="pencil">
        <polygon class="pencil-body" points="430,170 520,80 536,96 446,186"/>
        <polygon class="pencil-tip" points="430,170 446,186 420,196"/>
        <polygon class="pencil-cap" points="520,80 530,70 546,86 536,96"/>
    </g>

    <!-- New account card -->
    <g class="float-a">
        <rect class="card" x="36" y="96" width="176" height="66" rx="16"/>
        <circle class="av" cx="70" cy="129" r="17"/>
        <path class="plus" d="M70 121 v16 M62 129 h16"/>
        <rect class="bar strong" x="98" y="117" width="88" height="9" rx="4.5"/>
        <rect class="bar" x="98" y="134" width="58" height="8" rx="4"/>
    </g>

    <!-- Checklist card -->
    <g class="float-b">
        <rect class="card" x="452" y="280" width="160" height="126" rx="16"/>

        <circle class="ok c1" cx="478" cy="308" r="10"/>
        <path class="ok-t c1" d="M473.5 308 l3 3 l5.5 -6"/>
        <rect class="bar strong" x="498" y="303" width="88" height="9" rx="4.5"/>

        <circle class="ok c2" cx="478" cy="343" r="10"/>
        <path class="ok-t c2" d="M473.5 343 l3 3 l5.5 -6"/>
        <rect class="bar strong" x="498" y="338" width="70" height="9" rx="4.5"/>

        <circle class="ok c3" cx="478" cy="378" r="10"/>
        <path class="ok-t c3" d="M473.5 378 l3 3 l5.5 -6"/>
        <rect class="bar strong" x="498" y="373" width="80" height="9" rx="4.5"/>
    </g>

    <!-- Sparkles -->
    <g class="spark s1"><path d="M100 300 v18 M91 309 h18"/></g>
    <g class="spark s2"><path d="M560 210 v12 M554 216 h12"/></g>
    <g class="spark s3"><path d="M140 440 v14 M133 447 h14"/></g>
</svg>
